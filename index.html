
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistem Kasir Makanan</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <div class="container">

        <header>
            <h1>🍽️ SISTEM KASIR MAKANAN</h1>
            <p>Pengelolaan Data Makanan</p>
        </header>

        <!-- FORM INPUT -->
        <section class="card">

            <h2>Form Data Makanan</h2>

            <form id="formMakanan">

                <label>ID Makanan</label>
                <input type="text" id="id_makanan"
                    placeholder="ID otomatis" disabled>

                <label>Nama Makanan</label>
                <input type="text" id="nama_makanan"
                    placeholder="Masukkan nama makanan" required>

                <label>Harga Makanan</label>
                <input type="number" id="harga"
                    placeholder="Masukkan harga makanan"
                    min="0.01" step="any" required>

                <div class="button-group">
                    <button type="submit" id="btnSimpan">
                        + Tambah Data
                    </button>

                    <button type="button" class="btn-reset"
                        id="btnReset">
                        Reset
                    </button>
                </div>

            </form>

            <p id="pesan"></p>

        </section>

        <!-- TABEL DATA -->
        <section class="card">

            <h2>Daftar Data Makanan</h2>

            <div class="table-container">

                <table>
                    <thead>
                        <tr>
                            <th>ID Makanan</th>
                            <th>Nama Makanan</th>
                            <th>Harga</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>

                    <tbody id="tabelMakanan">
                        <tr>
                            <td colspan="4">Memuat data...</td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </section>

        <footer>
            <p>© 2026 Sistem Kasir Makanan</p>
        </footer>

    </div>

    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
